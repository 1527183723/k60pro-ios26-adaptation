# Display-only Xiaomi 15 experiment based on the unmodified warsaw profile.
# This does not select dada touch, gauge, Wi-Fi, GPU or power drivers.
. common/devices/warsaw.conf
NAME="Xiaomi 15 / dada (warsaw display-only experiment)"
UEFI_TARGET=annibale  # The README's Mu dependency has this package; driver list is unchanged.
UEFI_FD=out/dada-display-only-r1/SILICIUM_UEFI.fd
DTB=out/dada-display-only-r1/inputs/dada-merged.dtb
LOADER_CFLAGS="-DDIRECT_PHONE_PLAT -DWARSAW -DDADA_DISPLAY_ONLY"
# Match the physical panel without changing peripheral or CPU boot options.
BOOTARGS="$BOOTARGS fbwidth=1200 fbheight=2670 fbpitch=460"
