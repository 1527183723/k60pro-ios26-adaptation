name: build-xnu-socrates

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install host tools
        run: brew install gmake unifdef

      - name: Apply XNU source
        run: |
          export XNU26_SRC="$GITHUB_WORKSPACE/xnu-src/xnu-12377.121.6"
          bash xnu26/apply.sh "$XNU26_SRC"

      - name: Stage 1 dependencies
        run: |
          export XNU26_SRC="$GITHUB_WORKSPACE/xnu-src/xnu-12377.121.6"
          export XNU26_DEPS="$GITHUB_WORKSPACE/xnu-deps/26"
          bash xnu26/deps-macos.sh --stage1

      - name: Export kernel headers
        run: |
          export XNU26_SRC="$GITHUB_WORKSPACE/xnu-src/xnu-12377.121.6"
          export XNU26_DEPS="$GITHUB_WORKSPACE/xnu-deps/26"
          MAKE=gmake bash xnu26/build-macos.sh exporthdrs installhdrs

      - name: Stage 2 dependencies
        run: |
          export XNU26_SRC="$GITHUB_WORKSPACE/xnu-src/xnu-12377.121.6"
          export XNU26_DEPS="$GITHUB_WORKSPACE/xnu-deps/26"
          bash xnu26/deps-macos.sh --stage2

      - name: Build XNU
        run: |
          export XNU26_SRC="$GITHUB_WORKSPACE/xnu-src/xnu-12377.121.6"
          export XNU26_DEPS="$GITHUB_WORKSPACE/xnu-deps/26"
          MAKE=gmake bash xnu26/build-macos.sh -j"$(sysctl -n hw.ncpu)"

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: xnu-socrates
          path: xnu-src/xnu-12377.121.6/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
