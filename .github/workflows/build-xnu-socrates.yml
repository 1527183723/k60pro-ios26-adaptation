name: build-xnu-socrates

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install host tools
        run: |
          brew install make unifdef
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          printf '#!/bin/sh\nsysctl -n hw.ncpu\n' > /tmp/nproc
          sudo install -m 755 /tmp/nproc /usr/local/bin/nproc

      - name: Apply XNU source
        run: |
          export XNU26_SRC="$GITHUB_WORKSPACE/xnu-src/xnu-12377.121.6"
          bash xnu26/apply.sh "$XNU26_SRC"

      - name: Stage 1 dependencies
        run: |
          export XNU26_SRC="$GITHUB_WORKSPACE/xnu-src/xnu-12377.121.6"
          export XNU26_DEPS="$GITHUB_WORKSPACE/xnu-deps/26"
          bash xnu26/deps-macos.sh --stage1

      - name: Export kernel headers
        run: |
          export XNU26_SRC="$GITHUB_WORKSPACE/xnu-src/xnu-12377.121.6"
          export XNU26_DEPS="$GITHUB_WORKSPACE/xnu-deps/26"
          MAKE=gmake bash xnu26/build-macos.sh exporthdrs installhdrs

      - name: Prepare pthread header
        run: |
          mkdir -p xnu-deps/build/pthread/inc
          for sdk in "$(xcrun --sdk iphoneos --show-sdk-path)" "$(xcrun --sdk macosx --show-sdk-path)"; do
            if [ -f "$sdk/usr/include/TargetConditionals.h" ]; then
              cp "$sdk/usr/include/TargetConditionals.h" xnu-deps/build/pthread/inc/
              break
            fi
          done
          test -f xnu-deps/build/pthread/inc/TargetConditionals.h

      - name: Stage 2 dependencies
        run: |
          export XNU26_SRC="$GITHUB_WORKSPACE/xnu-src/xnu-12377.121.6"
          export XNU26_DEPS="$GITHUB_WORKSPACE/xnu-deps/26"
          bash xnu26/deps-macos.sh --stage2

      - name: Build XNU
        run: |
          export XNU26_SRC="$GITHUB_WORKSPACE/xnu-src/xnu-12377.121.6"
          export XNU26_DEPS="$GITHUB_WORKSPACE/xnu-deps/26"
          MAKE=gmake bash xnu26/build-macos.sh -j"$(sysctl -n hw.ncpu)"

      - name: Record fixed-kernel provenance
        run: |
          python3 -B tools/k60pro/kernel_provenance.py \
            --repo "$GITHUB_WORKSPACE" \
            --kernel xnu-src/xnu-12377.121.6/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837 \
            --output out/socrates-kernel-provenance.json

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: xnu-socrates
          path: |
            xnu-src/xnu-12377.121.6/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
            out/socrates-kernel-provenance.json
